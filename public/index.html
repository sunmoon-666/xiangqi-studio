<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182022"><title>楚河棋室 · 中国象棋</title><meta name="description" content="在线中国象棋，同屏双人或挑战全力搜索的皮卡鱼引擎。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='7' fill='%23a84030'/%3E%3Ctext x='24' y='35' text-anchor='middle' font-size='33' fill='white'%3E棋%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="/style.css"></head>
<body><header><div class="mast"><div class="mark" aria-hidden="true">楚</div><div class="brand">楚河棋室<small>CHUHE XIANGQI CLUB</small></div></div><button id="help" class="quiet">ⓘ　对弈规则</button></header>
<main><div class="heading"><div class="eyebrow"><i></i> PLAYING ROOM</div><h1>对弈大厅<span>。</span></h1></div>
<div class="layout"><section class="table" aria-label="象棋对局"><div class="seat"><span class="token black">將</span><b id="topSeat">皮卡鱼</b><small>黑方</small></div><div class="frame"><div class="board" id="board" aria-label="中国象棋棋盘"><canvas id="lines" aria-hidden="true"></canvas><div class="squares" id="squares"></div></div></div><div class="seat bottom"><span class="token red">帥</span><b id="bottomSeat">玩家</b><small>红方</small></div></section>
<aside><div class="module"><div class="section-title"><b>对局设置</b><span>GAME SETUP</span></div><div class="modes"><button id="ai">人机对弈</button><button id="local">同屏双人</button></div><div class="engine-row"><div><small id="rivalLabel">对弈引擎</small><strong id="rival">皮卡鱼 <em>PIKAFISH</em></strong></div><span class="badge" id="badge">最高难度</span></div></div>
<div class="module state"><div class="section-title"><b>当前局势</b><span id="round">第 01 回合</span></div><div class="turn" id="turn" role="status"></div><div id="detail"></div><button id="retry" hidden>重试加载引擎</button><div class="actions"><button id="undo">↶　悔棋</button><button id="restart">↻　重新开局</button></div></div>
<div class="module journal"><div class="section-title"><b>棋谱</b><span>MOVE RECORD</span></div><div class="record-head"><span>回合</span><span>红方</span><span>黑方</span></div><div id="moves" aria-label="本局棋谱"></div></div></aside></div></main>
<footer><span>楚河棋室</span><span>中国象棋　 /　 XIANGQI</span></footer>
<dialog id="dialog"><h2 id="dialogTitle"></h2><div id="dialogText"></div><div class="dialog-actions"><button id="dismiss">关闭</button><button id="confirm" hidden>确认</button></div></dialog>
<script type="module" src="/game.mjs"></script></body></html>
